name: Build TindaTala AdMob Shell Courier

on:
  pull_request:
    paths:
      - 'tindatala-admob-ci/**'
      - '.github/workflows/tindatala-admob-shell-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Add placeholder launcher icon
        run: |
          set -euo pipefail
          mkdir -p tindatala-admob-ci/app/src/main/res/mipmap-xxxhdpi
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlK9GQAAAAASUVORK5CYII=' | base64 -d > tindatala-admob-ci/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tindatala-admob-ci/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('android:hardwareAccelerated="true"', 'android:hardwareAccelerated="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"')
          p.write_text(s)
          PY
      - name: Build unsigned shell
        working-directory: tindatala-admob-ci
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/TindaTala-v1.3.2-AdMob-Test-shell-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/"* > "$GITHUB_WORKSPACE/out/SHA256SUMS.txt"
      - name: Publish temporary prerelease courier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='tindatala-v132-admob-shell-ci'
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" out/* \
            --title 'Temporary TindaTala AdMob shell courier' \
            --notes 'Unsigned generic CI shell only. No v1.3.2 business assets, no signing key, no live ad IDs.' \
            --prerelease \
            --target "$GITHUB_SHA"
